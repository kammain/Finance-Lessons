<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Finance Lessons</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,600&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
:root{--paper:#fcfcfb;--ink:#1c1e23;--muted:#5b616d;--rule:#dcdfe4;--accent:#9d0a1f}
@media (prefers-color-scheme:dark){:root{--paper:#15171b;--ink:#eceef2;--muted:#a3a9b5;--rule:#2d3139;--accent:#ff7184;color-scheme:dark}}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 "IBM Plex Sans",system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:56px 20px}
h1{font-family:Newsreader,Georgia,serif;font-weight:600;font-size:40px;margin:0 0 6px;color:var(--accent)}
p{color:var(--muted);margin:0 0 32px}
a.l{display:flex;gap:16px;align-items:baseline;padding:16px 0;border-top:1px solid var(--rule);color:var(--ink);text-decoration:none}
a.l:hover b{color:var(--accent)}
a.l span{font-size:13px;color:var(--muted);min-width:5em;letter-spacing:.06em;text-transform:uppercase}
</style>
</head>
<body>
<main>
  <h1>Finance Lessons</h1>
  <p>Interactive lecture decks. Open a lesson to follow along live or explore on your own.</p>
  <a class="l" href="lesson3/"><span>Lesson 3</span><b>Moving money through time: PV and FV</b></a>
</main>
</body>
</html>
