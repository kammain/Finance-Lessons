name: Clear stuck Pages deployment (one-time)
on:
  push:
    paths: ['.github/workflows/fix-stuck-pages.yml']
  workflow_dispatch:
permissions:
  pages: write
  contents: read
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel the stuck deployment and request a new build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST repos/${{ github.repository }}/pages/deployments/6483b388a80423c907bee6f9489b261650e0ba2f/cancel || echo "cancel returned an error (it may already be cleared)"
          sleep 20
          gh api -X POST repos/${{ github.repository }}/pages/builds || echo "build request returned an error"
